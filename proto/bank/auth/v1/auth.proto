syntax = "proto3";

package bank.auth.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/Mazik-kun/mini-core/contracts/gen/bank/auth/v1;authv1";

// Role — роль пользователя в системе.
enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_CLIENT = 1;
    ROLE_OFFICER = 2;
    ROLE_ADMIN = 3;
}

// AuthService отвечает за регистрацию, аутентификацию и работу с токенами.
service AuthService {
    rpc Register(RegisterRequest) returns (RegisterResponse);            // роль CLIENT
    rpc Login(LoginRequest) returns (LoginResponse);                     // access + refresh
    rpc Refresh(RefreshRequest) returns (LoginResponse);
    rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
    rpc CreateOfficer(CreateOfficerRequest) returns (RegisterResponse);  // только ADMIN
}

message RegisterRequest {
    string email = 1;
    string password = 2;
}

message RegisterResponse {
    string user_id = 1;
    string email = 2;
    Role role = 3;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
    int64 expires_in = 3;   // секунды
}

message RefreshRequest {
    string refresh_token = 1;
}

message LogoutRequest {
    string refresh_token = 1;
}

message ValidateTokenRequest {
    string access_token = 1;
}

message ValidateTokenResponse {
    string user_id = 1;
    Role role = 2;
    string customer_id = 3;  // пустая строка, если клиент ещё не создан
}

message CreateOfficerRequest {
    string email = 1;
    string password = 2;
}