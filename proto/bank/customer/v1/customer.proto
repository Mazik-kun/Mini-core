syntax = "proto3";

package bank.customer.v1;

import "google/protobuf/timestamp.proto";
import "bank/common/v1/common.proto";

option go_package = "github.com/Mazik-kun/mini-core/contracts/gen/bank/customer/v1;customerv1";

// CustomerStatus — статус клиента в онбординге.
enum CustomerStatus {
    CUSTOMER_STATUS_UNSPECIFIED = 0;
    CUSTOMER_STATUS_NEW = 1;
    CUSTOMER_STATUS_PROFILE_FILLED = 2;
    CUSTOMER_STATUS_ON_KYC = 3;
    CUSTOMER_STATUS_ACTIVE = 4;
    CUSTOMER_STATUS_REJECTED = 5;
    CUSTOMER_STATUS_BLOCKED = 6;
}

service CustomerService {
    rpc GetCustomer(GetCustomerRequest) returns (Customer);
    rpc UpdateProfile(UpdateProfileRequest) returns (Customer);
    rpc GetCustomerStatus(GetCustomerStatusRequest) returns (GetCustomerStatusResponse);
    rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);  // OFFICER
}

message Customer {
    string customer_id = 1;
    string email = 2;
    string full_name = 3;
    google.protobuf.Timestamp date_of_birth = 4;
    string address = 5;
    string phone = 6;
    string citizenship = 7;
    CustomerStatus status = 8;
    google.protobuf.Timestamp created_at = 9;
    google.protobuf.Timestamp updated_at = 10;
}

message GetCustomerRequest {
    string customer_id = 1;
}

message UpdateProfileRequest {
    string customer_id = 1;
    string full_name = 2;
    google.protobuf.Timestamp date_of_birth = 3;
    string address = 4;
    string phone = 5;
    string citizenship = 6;
}

message GetCustomerStatusRequest {
    string customer_id = 1;
}

message GetCustomerStatusResponse {
    CustomerStatus status = 1;
}

message ListCustomersRequest {
    bank.common.v1.PageRequest page = 1;
    CustomerStatus status_filter = 2;  // опционально: пусто = все
}

message ListCustomersResponse {
    repeated Customer customers = 1;
    bank.common.v1.PageResponse page = 2;
}