name: mini-core

# Общие настройки для всех Go-сервисов
x-app: &app
  env_file: .env.docker
  restart: on-failure
  volumes:
    - ./secrets:/app/secrets:ro

services:
  # ================= ИНФРАСТРУКТУРА =================
  postgres:
    image: postgres:16
    container_name: mini-core-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ -> переменные берутся уже внутри контейнера
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: mini-core-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/silo:latest
    container_name: mini-core-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  kafka:
    image: apache/kafka:4.1.1
    container_name: mini-core-kafka
    ports:
      - "9092:9092" # EXTERNAL: для сервисов, запущенных локально на хосте
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # из контейнеров: kafka:19092, с хоста: localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Создаёт топики ДО старта сервисов: consumer, подписавшийся на ещё не существующий
  # топик, может его не подхватить (гонка при первом запуске / после down -v)
  kafka-init:
    image: apache/kafka:4.1.1
    container_name: mini-core-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for t in auth.events customer.events kyc.events ledger.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
        echo "topics ready"

  # ================= МИГРАЦИИ =================
  migrate:
    build:
      context: .
      target: migrator_final
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for srv in auth customer document kyc account ledger; do
          echo "==> migrations: $$srv"
          goose -dir /services/$$srv/migrations postgres "postgres://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres:5432/$${srv}_db?sslmode=disable" up
        done
    depends_on:
      postgres:
        condition: service_healthy

  # ================= МИКРОСЕРВИСЫ =================
  auth:
    <<: *app
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: auth
    container_name: mini-core-auth
    ports:
      - "50051:50051"
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  customer:
    <<: *app
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: customer
    container_name: mini-core-customer
    ports:
      - "50052:50052"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  document:
    <<: *app
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: document
    container_name: mini-core-document
    ports:
      - "50054:50054"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  kyc:
    <<: *app
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: kyc
    container_name: mini-core-kyc
    environment:
      # В .env.docker DOCUMENT_GRPC_ADDR=:50054 - это адрес прослушивания сервиса document.
      # KYC читает ту же переменную как адрес клиента, поэтому для него переопределяем.
      DOCUMENT_GRPC_ADDR: document:50054
    ports:
      - "50055:50055"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      document:
        condition: service_started
      customer:
        condition: service_started

  account:
    <<: *app
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: account
    container_name: mini-core-account
    ports:
      - "50056:50056"
    depends_on:
      migrate:
        condition: service_completed_successfully
      customer:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  ledger:
    <<: *app
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: ledger
    container_name: mini-core-ledger
    ports:
      - "50057:50057"
    depends_on:
      migrate:
        condition: service_completed_successfully
      account:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  api-gateway:
    <<: *app
    build:
      context: .
      target: service
      args:
        SERVICE_NAME: api-gateway
    container_name: mini-core-gateway
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      auth:
        condition: service_started
      customer:
        condition: service_started
      document:
        condition: service_started
      kyc:
        condition: service_started
      account:
        condition: service_started
      ledger:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data: